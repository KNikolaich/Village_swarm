; Village Swarm hornet firmware. One env per role and board: <role>-<board> (spec 5.2).
; New hornet type = new file in src/roles/ + envs here. Pin defaults (HW_*) can be overridden by the
; hornet config "hw" section (contracts/schemas/config.schema.json).
;
;   guard-cam                    ESP32-CAM AI-Thinker
;   meteo-* / relay-*            c3 (ESP32-C3 mini), d1mini (Wemos D1 mini), nodemcu (NodeMCU v3), esp01 (ESP-01/01S)
;   heat-*                       ESP8266 only (d1mini, nodemcu, esp01): thermometer, relay or heater by config "features"
;   meteo-* and heat-* read DS18B20s or a DHT11/DHT22 as their thermometer, as config hw.thermometer says

[platformio]
default_envs = guard-cam

[env]
framework = arduino
monitor_speed = 115200
; chain: the Arduino-ESP32 3.x Network library is not found with deep+
lib_ldf_mode = chain
lib_deps =
    bblanchon/ArduinoJson@^7.4.2
    bertmelis/espMqttClient@^1.7.1
build_flags =
    -DCORE_DEBUG_LEVEL=1
; HORNET_FW_VERSION (e.g. 0.2.0+a1b2c3d) is defined by scripts/version.py: the hive tells builds apart by it.
extra_scripts =
    pre:scripts/version.py
    post:scripts/dist.py

[meteo_libs]
lib_deps =
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^4.0.4
    adafruit/Adafruit BME280 Library@^2.2.4
    beegee-tokyo/DHT sensor library for ESPx@^1.19
src_filter = +<*> -<roles/> +<roles/meteo.cpp>

[ble_libs]
lib_deps =
    h2zero/NimBLE-Arduino@^2.3.4
src_filter = +<*> -<roles/> +<roles/ble.cpp>

; Infrared receiver and emitter (roles irrx / irtx): IRremoteESP8266 with only the protocols remotes of simple devices use, to keep
; an ESP-01 image small enough for an update over the air (the library with every protocol would not fit).
[ir_libs]
lib_deps = crankyoldgit/IRremoteESP8266@^2.8.6
build_flags =
    -D_IR_ENABLE_DEFAULT_=false
    -DDECODE_HASH=false
    -DDECODE_NEC=true -DSEND_NEC=true
    -DDECODE_SONY=true -DSEND_SONY=true
    -DDECODE_RC5=true -DSEND_RC5=true
    -DDECODE_RC6=true -DSEND_RC6=true
    -DDECODE_SAMSUNG=true -DSEND_SAMSUNG=true
    -DDECODE_LG=true -DSEND_LG=true
    -DDECODE_PANASONIC=true -DSEND_PANASONIC=true
    -DDECODE_JVC=true -DSEND_JVC=true
    -DDECODE_SHARP=true -DSEND_SHARP=true
    -DDECODE_NIKAI=true -DSEND_NIKAI=true
    -DDECODE_RCMM=true -DSEND_RCMM=true
src_filter = +<*> -<roles/> +<roles/ir.cpp>

[relay_libs]
src_filter = +<*> -<roles/> +<roles/relay.cpp>

; Universal ESP8266 hornet: thermometer, BME280, relay and heater, chosen per hornet by config "features".
[heat_libs]
lib_deps = ${meteo_libs.lib_deps}
src_filter = +<*> -<roles/> +<roles/heat.cpp>

; ---------------------------------------------------------------- ESP32 (Arduino core 3.x via pioarduino)
[esp32_base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30-2/platform-espressif32.zip

[env:guard-cam]
extends = esp32_base
board = esp32cam
board_build.partitions = min_spiffs.csv
build_flags =
    ${env.build_flags}
    -DHORNET_BOARD=\"esp32cam-aithinker\"
    -DBOARD_HAS_PSRAM
    -DHW_RELAY_PIN=4
    -mfix-esp32-psram-cache-issue
build_src_filter = +<*> -<roles/> +<roles/guard_cam.cpp>

; ESP32-C3 mini boards (SuperMini, 0.42" OLED board): USB serial built in.
[c3_base]
extends = esp32_base
board = esp32-c3-devkitm-1
board_build.partitions = min_spiffs.csv
build_flags =
    ${env.build_flags}
    -DHORNET_BOARD=\"esp32c3-mini\"
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DHW_ONEWIRE_PIN=3
    -DHW_SDA_PIN=8
    -DHW_SCL_PIN=9
    -DHW_RELAY_PIN=10

[env:meteo-c3]
extends = c3_base
lib_deps =
    ${env.lib_deps}
    ${meteo_libs.lib_deps}
build_src_filter = ${meteo_libs.src_filter}

; Bluetooth LE bridge (Inkbird IHT-2PB kitchen thermometer): any ESP32-C3 board within a few metres of it.
[env:ble-c3]
extends = c3_base
lib_deps =
    ${env.lib_deps}
    ${ble_libs.lib_deps}
build_src_filter = ${ble_libs.src_filter}

[env:relay-c3]
extends = c3_base
build_src_filter = ${relay_libs.src_filter}

; ESP32-C3 board with the 0.42" OLED (72x40 SSD1306 on GPIO5/6). Battery divider: set hw.vbat_pin/vbat_ratio.
[env:meteo-c3oled]
extends = esp32_base
board = esp32-c3-devkitm-1
board_build.partitions = min_spiffs.csv
build_flags =
    ${env.build_flags}
    -DHORNET_BOARD=\"esp32c3-oled-042\"
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DHORNET_DISPLAY=1
    -DHW_ONEWIRE_PIN=3
    -DHW_SDA_PIN=5
    -DHW_SCL_PIN=6
lib_deps =
    ${env.lib_deps}
    ${meteo_libs.lib_deps}
    olikraus/U8g2@^2.36.5
build_src_filter = ${meteo_libs.src_filter}

; ---------------------------------------------------------------- ESP8266 (Arduino core 3.1)
[esp8266_base]
platform = espressif8266@4.2.1
; The pioarduino ESP32 platform and espressif8266 both keep their esptool in ~/.platformio/packages/tool-esptoolpy
; and replace each other's copy, which breaks the ESP32 builds. So ESP8266 envs ask for the very same package
; as pioarduino and flash with the esptool module of the PlatformIO Python (esptool 5 still supports ESP8266).
platform_packages = tool-esptoolpy @ https://github.com/pioarduino/registry/releases/download/0.0.1/esptoolpy-v5.0.2.zip
upload_command = $PYTHONEXE -m esptool --chip esp8266 --port $UPLOAD_PORT --baud $UPLOAD_SPEED write-flash 0x0 $SOURCE
lib_deps =
    ${env.lib_deps}
    ; Preferences (NVS) API on LittleFS: the same settings code as on ESP32
    vshymanskyy/Preferences@^2.1.0
board_build.filesystem = littlefs

; Wemos D1 mini and NodeMCU v3: I2C on D2/D1, 1-Wire on D5, relay on D6, button on D3 (the FLASH button on NodeMCU).
[d1_pins]
build_flags =
    ${env.build_flags}
    -DHW_ONEWIRE_PIN=14
    -DHW_SDA_PIN=4
    -DHW_SCL_PIN=5
    -DHW_RELAY_PIN=12
    -DHW_BUTTON_PIN=0

[env:meteo-d1mini]
extends = esp8266_base
board = d1_mini
build_flags = ${d1_pins.build_flags} -DHORNET_BOARD=\"wemos-d1-mini\"
lib_deps =
    ${esp8266_base.lib_deps}
    ${meteo_libs.lib_deps}
build_src_filter = ${meteo_libs.src_filter}

[env:relay-d1mini]
extends = esp8266_base
board = d1_mini
build_flags = ${d1_pins.build_flags} -DHORNET_BOARD=\"wemos-d1-mini\"
build_src_filter = ${relay_libs.src_filter}

[env:heat-d1mini]
extends = esp8266_base
board = d1_mini
build_flags = ${d1_pins.build_flags} -DHORNET_BOARD=\"wemos-d1-mini\"
lib_deps =
    ${esp8266_base.lib_deps}
    ${heat_libs.lib_deps}
build_src_filter = ${heat_libs.src_filter}

[env:meteo-nodemcu]
extends = esp8266_base
board = nodemcuv2
build_flags = ${d1_pins.build_flags} -DHORNET_BOARD=\"nodemcu-v3\"
lib_deps =
    ${esp8266_base.lib_deps}
    ${meteo_libs.lib_deps}
build_src_filter = ${meteo_libs.src_filter}

[env:relay-nodemcu]
extends = esp8266_base
board = nodemcuv2
build_flags = ${d1_pins.build_flags} -DHORNET_BOARD=\"nodemcu-v3\"
build_src_filter = ${relay_libs.src_filter}

[env:heat-nodemcu]
extends = esp8266_base
board = nodemcuv2
build_flags = ${d1_pins.build_flags} -DHORNET_BOARD=\"nodemcu-v3\"
lib_deps =
    ${esp8266_base.lib_deps}
    ${heat_libs.lib_deps}
build_src_filter = ${heat_libs.src_filter}

; ESP-01/01S, 1 MB: the ready-made modules put the relay on GPIO0 (active low on "ESP-01S Relay")
; and the DS18B20 on GPIO2. I2C (BME280) uses GPIO0/GPIO2 when there is no relay.
; 1 MB flash: the board default keeps 256 KB for the file system (settings), which leaves only about 340 KB for
; an over-the-air update, less than any of our images. 64 KB is plenty for settings and leaves about 530 KB (docs/ota.md).
; Moving the file system means an ESP-01 flashed with the old layout must be flashed once by USB; the new image
; copies its settings from the old place on the first boot (lib/hornet-core/src/LegacyFs.h).
[esp01_layout]
board_build.ldscript = eagle.flash.1m64.ld

[esp01_pins]
build_flags =
    ${env.build_flags}
    -DHORNET_BOARD=\"esp-01\"
    -DHW_ONEWIRE_PIN=2
    -DHW_SDA_PIN=0
    -DHW_SCL_PIN=2
    -DHW_RELAY_PIN=0
    -DHW_RELAY_ACTIVE_LOW=1
    -DHW_VBAT_VCC=1

[env:meteo-esp01]
extends = esp8266_base, esp01_layout
board = esp01_1m
build_flags = ${esp01_pins.build_flags}
lib_deps =
    ${esp8266_base.lib_deps}
    ${meteo_libs.lib_deps}
build_src_filter = ${meteo_libs.src_filter}

; "ESP-01S DHT11 v1.0" module: the DHT11 sits on GPIO2 and is the thermometer by default (no 1-Wire, no I2C).
; A DHT22 on the same module: config hw.thermometer = "dht22".
[env:meteo-esp01dht]
extends = esp8266_base, esp01_layout
board = esp01_1m
build_flags =
    ${env.build_flags}
    -DHORNET_BOARD=\"esp-01-dht11\"
    -DHW_ONEWIRE_PIN=-1
    -DHW_SDA_PIN=-1
    -DHW_SCL_PIN=-1
    -DHW_DHT_PIN=2
    -DHW_DHT_TYPE=11
    -DHW_VBAT_VCC=1
lib_deps =
    ${esp8266_base.lib_deps}
    ${meteo_libs.lib_deps}
build_src_filter = ${meteo_libs.src_filter}

[env:relay-esp01]
extends = esp8266_base, esp01_layout
board = esp01_1m
build_flags = ${esp01_pins.build_flags}
build_src_filter = ${relay_libs.src_filter}

; ESP-01/01S with a relay module on GPIO0 and a DS18B20 (GPIO2 by default, often moved to GPIO3 = RX): a heat lamp,
; a heater or just a thermometer, as config "features" says.
[env:heat-esp01]
extends = esp8266_base, esp01_layout
board = esp01_1m
build_flags = ${esp01_pins.build_flags}
lib_deps =
    ${esp8266_base.lib_deps}
    ${heat_libs.lib_deps}
build_src_filter = ${heat_libs.src_filter}

; ESP-01 on the "ESP-01 WS2812 RGB LED controller" board: its three-pin connector carries GPIO2 as the signal pin, so an
; infrared receiver module (irrx) or an emitter (irtx) plugs in there. One pin serves one of them: two builds, two hornets.
[env:irrx-esp01]
extends = esp8266_base, esp01_layout
board = esp01_1m
build_flags =
    ${env.build_flags}
    -DHORNET_BOARD=\"esp-01\"
    -DHORNET_IR_MODE=1
    -DHW_IR_PIN=2
    ${ir_libs.build_flags}
lib_deps =
    ${esp8266_base.lib_deps}
    ${ir_libs.lib_deps}
build_src_filter = ${ir_libs.src_filter}

[env:irtx-esp01]
extends = esp8266_base, esp01_layout
board = esp01_1m
build_flags =
    ${env.build_flags}
    -DHORNET_BOARD=\"esp-01\"
    -DHORNET_IR_MODE=2
    -DHW_IR_PIN=2
    ${ir_libs.build_flags}
lib_deps =
    ${esp8266_base.lib_deps}
    ${ir_libs.lib_deps}
build_src_filter = ${ir_libs.src_filter}

; ---------------------------------------------------------------- host tests: `pio test -e native`
[env:native]
platform = native
framework =
lib_deps =
extra_scripts =
; Tests include the Arduino-free headers directly; the full library needs Arduino.h.
lib_ignore = hornet-core
build_flags = -std=gnu++17
test_framework = unity
build_src_filter = -<*>
