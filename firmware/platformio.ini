; Village Swarm hornet firmware. One env per role (spec 5.2).
; New hornet type = new file in src/roles/ + new env here.

[platformio]
default_envs = guard-cam

[env]
framework = arduino
monitor_speed = 115200
lib_ldf_mode = chain
lib_deps =
    bblanchon/ArduinoJson@^7.4.2
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DHORNET_FW_VERSION=\"0.0.1\"

; pioarduino platform ships Arduino-ESP32 core 3.x (the official espressif32 platform is stuck on 2.x).
[esp32_base]
extra_scripts = post:scripts/dist.py
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30-2/platform-espressif32.zip

[env:guard-cam]
extends = esp32_base
board = esp32cam
board_build.partitions = min_spiffs.csv
lib_deps =
    ${env.lib_deps}
    bertmelis/espMqttClient@^1.7.1
build_flags =
    ${env.build_flags}
    -DHORNET_ROLE=\"guard-cam\"
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
build_src_filter = +<*> -<roles/> +<roles/guard_cam.cpp>

; Host-side unit tests for hornet-core logic: `pio test -e native`.
[env:native]
platform = native
framework =
lib_deps =
; Tests include the Arduino-free headers directly; the full library needs Arduino.h.
lib_ignore = hornet-core
build_flags = -std=gnu++17
test_framework = unity
build_src_filter = -<*>
