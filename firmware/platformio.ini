; Village Swarm hornet firmware. One env per role and board: <role>-<board> (spec 5.2).
; New hornet type = new file in src/roles/ + envs here. Pin defaults (HW_*) can be overridden by the
; hornet config "hw" section (contracts/schemas/config.schema.json).
;
;   guard-cam                    ESP32-CAM AI-Thinker
;   meteo-* / relay-*            c3 (ESP32-C3 mini), d1mini (Wemos D1 mini), nodemcu (NodeMCU v3), esp01 (ESP-01/01S)

[platformio]
default_envs = guard-cam

[env]
framework = arduino
monitor_speed = 115200
; chain: the Arduino-ESP32 3.x Network library is not found with deep+
lib_ldf_mode = chain
lib_deps =
    bblanchon/ArduinoJson@^7.4.2
    bertmelis/espMqttClient@^1.7.1
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DHORNET_FW_VERSION=\"0.1.0\"
extra_scripts = post:scripts/dist.py

[meteo_libs]
lib_deps =
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^4.0.4
    adafruit/Adafruit BME280 Library@^2.2.4
src_filter = +<*> -<roles/> +<roles/meteo.cpp>

[relay_libs]
src_filter = +<*> -<roles/> +<roles/relay.cpp>

; ---------------------------------------------------------------- ESP32 (Arduino core 3.x via pioarduino)
[esp32_base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30-2/platform-espressif32.zip

[env:guard-cam]
extends = esp32_base
board = esp32cam
board_build.partitions = min_spiffs.csv
build_flags =
    ${env.build_flags}
    -DHORNET_BOARD=\"esp32cam-aithinker\"
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
build_src_filter = +<*> -<roles/> +<roles/guard_cam.cpp>

; ESP32-C3 mini boards (SuperMini, 0.42" OLED board): USB serial built in.
[c3_base]
extends = esp32_base
board = esp32-c3-devkitm-1
board_build.partitions = min_spiffs.csv
build_flags =
    ${env.build_flags}
    -DHORNET_BOARD=\"esp32c3-mini\"
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DHW_ONEWIRE_PIN=3
    -DHW_SDA_PIN=8
    -DHW_SCL_PIN=9
    -DHW_RELAY_PIN=10

[env:meteo-c3]
extends = c3_base
lib_deps =
    ${env.lib_deps}
    ${meteo_libs.lib_deps}
build_src_filter = ${meteo_libs.src_filter}

[env:relay-c3]
extends = c3_base
build_src_filter = ${relay_libs.src_filter}

; ---------------------------------------------------------------- ESP8266 (Arduino core 3.1)
[esp8266_base]
platform = espressif8266@4.2.1
; The pioarduino ESP32 platform and espressif8266 both keep their esptool in ~/.platformio/packages/tool-esptoolpy
; and replace each other's copy, which breaks the ESP32 builds. So ESP8266 envs ask for the very same package
; as pioarduino and flash with the esptool module of the PlatformIO Python (esptool 5 still supports ESP8266).
platform_packages = tool-esptoolpy @ https://github.com/pioarduino/registry/releases/download/0.0.1/esptoolpy-v5.0.2.zip
upload_command = $PYTHONEXE -m esptool --chip esp8266 --port $UPLOAD_PORT --baud $UPLOAD_SPEED write-flash 0x0 $SOURCE
lib_deps =
    ${env.lib_deps}
    ; Preferences (NVS) API on LittleFS: the same settings code as on ESP32
    vshymanskyy/Preferences@^2.1.0
board_build.filesystem = littlefs

; Wemos D1 mini and NodeMCU v3: I2C on D2/D1, 1-Wire on D5, relay on D6, button on D3 (the FLASH button on NodeMCU).
[d1_pins]
build_flags =
    ${env.build_flags}
    -DHW_ONEWIRE_PIN=14
    -DHW_SDA_PIN=4
    -DHW_SCL_PIN=5
    -DHW_RELAY_PIN=12
    -DHW_BUTTON_PIN=0

[env:meteo-d1mini]
extends = esp8266_base
board = d1_mini
build_flags = ${d1_pins.build_flags} -DHORNET_BOARD=\"wemos-d1-mini\"
lib_deps =
    ${esp8266_base.lib_deps}
    ${meteo_libs.lib_deps}
build_src_filter = ${meteo_libs.src_filter}

[env:relay-d1mini]
extends = esp8266_base
board = d1_mini
build_flags = ${d1_pins.build_flags} -DHORNET_BOARD=\"wemos-d1-mini\"
build_src_filter = ${relay_libs.src_filter}

[env:meteo-nodemcu]
extends = esp8266_base
board = nodemcuv2
build_flags = ${d1_pins.build_flags} -DHORNET_BOARD=\"nodemcu-v3\"
lib_deps =
    ${esp8266_base.lib_deps}
    ${meteo_libs.lib_deps}
build_src_filter = ${meteo_libs.src_filter}

[env:relay-nodemcu]
extends = esp8266_base
board = nodemcuv2
build_flags = ${d1_pins.build_flags} -DHORNET_BOARD=\"nodemcu-v3\"
build_src_filter = ${relay_libs.src_filter}

; ESP-01/01S, 1 MB: the ready-made modules put the relay on GPIO0 (active low on "ESP-01S Relay")
; and the DS18B20 on GPIO2. I2C (BME280) uses GPIO0/GPIO2 when there is no relay.
[esp01_pins]
build_flags =
    ${env.build_flags}
    -DHORNET_BOARD=\"esp-01\"
    -DHW_ONEWIRE_PIN=2
    -DHW_SDA_PIN=0
    -DHW_SCL_PIN=2
    -DHW_RELAY_PIN=0
    -DHW_RELAY_ACTIVE_LOW=1

[env:meteo-esp01]
extends = esp8266_base
board = esp01_1m
build_flags = ${esp01_pins.build_flags}
lib_deps =
    ${esp8266_base.lib_deps}
    ${meteo_libs.lib_deps}
build_src_filter = ${meteo_libs.src_filter}

[env:relay-esp01]
extends = esp8266_base
board = esp01_1m
build_flags = ${esp01_pins.build_flags}
build_src_filter = ${relay_libs.src_filter}

; ---------------------------------------------------------------- host tests: `pio test -e native`
[env:native]
platform = native
framework =
lib_deps =
extra_scripts =
; Tests include the Arduino-free headers directly; the full library needs Arduino.h.
lib_ignore = hornet-core
build_flags = -std=gnu++17
test_framework = unity
build_src_filter = -<*>
