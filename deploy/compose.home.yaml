# Home node (the RPi at the dacha). The city node gets compose.city.yaml in build step 16.
services:
  # The bridge to the city broker is written at start when CITY_MQTT_HOST is set in .env (docs/city-node.md).
  mosquitto:
    environment:
      CITY_MQTT_HOST: ${CITY_MQTT_HOST:-}
      CITY_MQTT_PORT: ${CITY_MQTT_PORT:-1883}
      CITY_MQTT_USER: ${CITY_MQTT_USER:-bridge-home}
      CITY_MQTT_PASSWORD: ${CITY_MQTT_PASSWORD:-}
  api:
    environment:
      Hive__Node: home
      Hive__Role: active
      # Heartbeats to the city and taking the role back after it (off until a city node exists).
      Cluster__Enabled: ${CLUSTER_ENABLED:-false}
      # false: the dacha keeps its own notes even when the city offers to keep them (see docs/city-node.md, "Заметки в городе").
      Cluster__NotesInCity: ${CLUSTER_NOTES_IN_CITY:-true}
      # The login of a hornet on the city broker is made from this secret and its id; the city has the same one (hornets fall back to it, docs/city-node.md).
      Cluster__BridgePassword: ${CITY_MQTT_PASSWORD:-}
      # The hive watches itself: air at the board (DS18B20 on 1-Wire), CPU, disk (spec 3.1, 7.4).
      Hive__Sensors__Enabled: "true"
      Hive__Sensors__AirWarnC: ${HIVE_AIR_WARN_C:-45}
