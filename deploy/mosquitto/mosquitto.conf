# Hive broker (spec 4.1): dynamic security, every hornet has its own login and ACL.
# The admin client (the api) is created on first start by entrypoint.sh from MQTT_ADMIN_USER/PASSWORD.
allow_anonymous false
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

# Plain MQTT inside the isolated IoT segment; the bridge to the city (8883, TLS) comes with step 16.
listener 1883

persistence true
persistence_location /mosquitto/data/
autosave_interval 60
max_queued_messages 1000

log_dest stdout
log_type error
log_type warning
log_type notice
