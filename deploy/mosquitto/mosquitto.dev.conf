# Development broker: anonymous access, no TLS. Never use on the real hive.
# Production config (dynamic security, per-hornet ACL, bridge to the city node) arrives in build steps 10-11.
listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
