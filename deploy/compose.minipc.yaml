# Home node on the x86_64 mini PC (16 GB) instead of the RPi 4. Only what differs from compose.yaml + compose.home.yaml:
#   COMPOSE_FILE=compose.yaml:compose.home.yaml:compose.minipc.yaml   (in /opt/hive/.env)
#   HIVE_BIND_IP=<the mini PC's LAN address>                           (ports listen on it only, not on every interface)
# Images must be built for amd64: bash deploy/build-images.sh linux/amd64.
services:
  # Same ports as on the RPi (80: hornet uploads and OTA, 443: UI, 8088: the Keenetic site), bound to one address.
  # !override: without it compose appends these to the 0.0.0.0 bindings of compose.yaml and the ports clash.
  web:
    ports: !override
      - "${HIVE_BIND_IP:?set HIVE_BIND_IP in .env}:${HIVE_HTTP_PORT:-80}:80"
      - "${HIVE_BIND_IP:?set HIVE_BIND_IP in .env}:${HIVE_HTTPS_PORT:-443}:443"
      - "${HIVE_BIND_IP:?set HIVE_BIND_IP in .env}:${HIVE_EXTERNAL_PORT:-8088}:8088"
      # update.sh and install.sh check https://localhost/readyz; without this an update is rolled back every time.
      - "127.0.0.1:443:443"

  mosquitto:
    ports: !override
      - "${HIVE_BIND_IP:?set HIVE_BIND_IP in .env}:${HIVE_MQTT_PORT:-1883}:1883"

  # `command` is replaced as a whole, so the unchanged flags of compose.yaml are repeated here.
  postgres:
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=4GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=100
      - -c
      - wal_compression=on
      - -c
      - max_wal_size=2GB
    # The RPi's 448m would not even hold shared_buffers: 1 GB of buffers + 100 connections x (~10 MB + work_mem).
    mem_limit: 3g
    shm_size: 256m

  # H.264 copies of the H.265 cameras for browsers without H.265 (Chrome on Windows, most phones), made by the graphics
  # card (VA-API): the -hardware image has its drivers (amd64 only; compose pulls it, it is not in the deploy bundle).
  # ffmpeg reads a camera's stream back from go2rtc by name over RTSP, so go2rtc listens for RTSP inside its own
  # container only (127.0.0.1); nothing new is reachable from the network.
  go2rtc:
    image: alexxit/go2rtc:1.9.4-hardware
    command:
      - go2rtc
      - -config
      - /config/go2rtc.yaml
      - -config
      - "{api: {listen: ':1984', origin: '*'}, rtsp: {listen: '127.0.0.1:8554'}, webrtc: {listen: ''}, log: {level: warn}}"
    devices:
      - /dev/dri:/dev/dri
    # Each running copy is an ffmpeg (about 100-200 MB at 1440p).
    mem_limit: 1g

  api:
    mem_limit: 1g
    environment:
      Video__Transcode: vaapi
      # Pool 80 of the 100 connections; the rest is for the nightly dump and manual psql (deploy/test-db-pool.sh).
      ConnectionStrings__Hive: Host=postgres;Port=5432;Database=hive;Username=hive;Password=${PG_PASSWORD};Maximum Pool Size=80

  # Builds hornet firmware on the hive. Not started by `docker compose up`; run on demand, e.g.:
  #   docker compose --profile tools run --rm firmware-builder run -e guard-cam
  #   docker compose --profile tools run --rm firmware-builder test -e native
  # The firmware sources come from HIVE_FIRMWARE_DIR (a checkout of firmware/). PlatformIO, its toolchains and libraries
  # live in HIVE_DATA/platformio (PLATFORMIO_CORE_DIR, i.e. ~/.platformio), so only the first run downloads them.
  # Runs as HIVE_BUILDER_UID so .pio/ in the checkout stays owned by that user. The OTA private key is not mounted:
  # images built here are not signed (sign them where the key lives, docs/ota.md).
  firmware-builder:
    profiles: [tools]
    image: python:3.12-bookworm
    user: "${HIVE_BUILDER_UID:-1000}:${HIVE_BUILDER_GID:-1000}"
    working_dir: /work
    environment:
      HOME: /pio/home
      PLATFORMIO_CORE_DIR: /pio
      PLATFORMIO_VERSION: ${PLATFORMIO_VERSION:-6.1.18}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        if ! /pio/penv/bin/pio --version 2>/dev/null | grep -q "$$PLATFORMIO_VERSION"; then
          python -m venv /pio/penv
          /pio/penv/bin/pip install --quiet "platformio==$$PLATFORMIO_VERSION"
        fi
        exec /pio/penv/bin/pio "$$@"
      - pio
    command: ["--help"]
    volumes:
      - ${HIVE_FIRMWARE_DIR:-./firmware}:/work
      - ${HIVE_DATA:-/srv/hive}/platformio:/pio
    restart: "no"
