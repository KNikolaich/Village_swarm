<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1580 940" width="1580" height="940" font-family="DejaVu Sans, Arial, sans-serif">
<rect width="1580" height="940" fill="#ffffff"/>
<text x="40" y="44" font-size="26" fill="#111" text-anchor="start" font-weight="700">Схема 2: автомат 10 А + модуль INA226 с шунтом R100 (после замены на R010) + ESP32-C3</text>
<text x="40" y="72" font-size="15" fill="#555" text-anchor="start" font-weight="400">Через шунт идёт весь ток АКБ. Ток &gt; 0 — АКБ отдаёт, ток &lt; 0 — заряжается.</text>
<rect x="40" y="170" width="170" height="170" rx="10" fill="#eef2f7" stroke="#333" stroke-width="3"/>
<text x="125" y="215" font-size="20" fill="#111" text-anchor="middle" font-weight="700">АКБ 12 В</text>
<text x="125" y="243" font-size="16" fill="#444" text-anchor="middle" font-weight="400">55 А·ч</text>
<circle cx="210" cy="250" r="8" fill="#d62828"/>
<text x="196" y="238" font-size="20" fill="#d62828" text-anchor="end" font-weight="700">+</text>
<circle cx="125" cy="340" r="8" fill="#222"/>
<text x="140" y="330" font-size="22" fill="#222" text-anchor="start" font-weight="700">−</text>
<rect x="250" y="196" width="130" height="104" rx="8" fill="#2b2b2b" stroke="#000" stroke-width="3"/>
<rect x="268" y="204" width="94" height="30" rx="4" fill="#d62828"/>
<text x="315" y="224" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">10 А</text>
<text x="315" y="252" font-size="13" fill="#ddd" text-anchor="middle" font-weight="400">автомат</text>
<circle cx="250" cy="270" r="7" fill="#d62828"/>
<text x="262" y="274" font-size="12" fill="#fff" text-anchor="start" font-weight="400">2 LINE</text>
<circle cx="380" cy="270" r="7" fill="#d62828"/>
<text x="368" y="274" font-size="12" fill="#fff" text-anchor="end" font-weight="400">3 LOAD</text>
<circle cx="315" cy="300" r="6" fill="#999"/>
<text x="315" y="320" font-size="12" fill="#777" text-anchor="middle" font-weight="400">1 WS — не подключать</text>
<path d="M210,250 H230 V270 H250" fill="none" stroke="#d62828" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M380,270 H410 V250 H450" fill="none" stroke="#d62828" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="315" y="186" font-size="12" fill="#555" text-anchor="middle" font-weight="400">автомат AC 125/250 В</text>
<rect x="450" y="140" width="450" height="150" rx="10" fill="#e8f1ff" stroke="#1d4f9c" stroke-width="3"/>
<text x="675" y="170" font-size="20" fill="#111" text-anchor="middle" font-weight="700">Модуль INA226</text>
<text x="675" y="192" font-size="13" fill="#444" text-anchor="middle" font-weight="400">большие отверстия — силовой ток (по краям шунта)</text>
<circle cx="450" cy="250" r="8" fill="#d62828"/>
<text x="440" y="276" font-size="12" fill="#d62828" text-anchor="start" font-weight="700">IN+ (силовой)</text>
<circle cx="900" cy="250" r="8" fill="#d62828"/>
<text x="910" y="276" font-size="12" fill="#d62828" text-anchor="end" font-weight="700">IN− (силовой)</text>
<rect x="520" y="210" width="310" height="50" rx="6" fill="#ffe9c4" stroke="#b36b00" stroke-width="2.5"/>
<text x="675" y="231" font-size="14" fill="#7a4500" text-anchor="middle" font-weight="700">шунт: R100 → заменить на R010</text>
<text x="675" y="250" font-size="12" fill="#7a4500" text-anchor="middle" font-weight="400">(2512, 10 мОм, ≥1 Вт) → ina_shunt_mohm: 10</text>
<path d="M450,250 H485 V235 H520" fill="none" stroke="#d62828" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M830,235 H865 V250 H900" fill="none" stroke="#d62828" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="480" cy="290" r="6" fill="#e08a00"/>
<text x="480" y="282" font-size="13" fill="#e08a00" text-anchor="middle" font-weight="700">VCC</text>
<circle cx="530" cy="290" r="6" fill="#222"/>
<text x="530" y="282" font-size="13" fill="#222" text-anchor="middle" font-weight="700">GND</text>
<circle cx="580" cy="290" r="6" fill="#17a34a"/>
<text x="580" y="282" font-size="13" fill="#17a34a" text-anchor="middle" font-weight="700">SCL</text>
<circle cx="630" cy="290" r="6" fill="#1d6fd6"/>
<text x="630" y="282" font-size="13" fill="#1d6fd6" text-anchor="middle" font-weight="700">SDA</text>
<circle cx="680" cy="290" r="6" fill="#888"/>
<text x="680" y="282" font-size="13" fill="#888" text-anchor="middle" font-weight="700">ALE</text>
<circle cx="730" cy="290" r="6" fill="#e08a00"/>
<text x="730" y="282" font-size="13" fill="#e08a00" text-anchor="middle" font-weight="700">VBS</text>
<circle cx="780" cy="290" r="6" fill="#d62828"/>
<text x="780" y="282" font-size="13" fill="#d62828" text-anchor="middle" font-weight="700">IN−</text>
<circle cx="830" cy="290" r="6" fill="#d62828"/>
<text x="830" y="282" font-size="13" fill="#d62828" text-anchor="middle" font-weight="700">IN+</text>
<text x="680" y="312" font-size="11" fill="#888" text-anchor="middle" font-weight="400">не подключать</text>
<path d="M730,290 V312 H780 V290" fill="none" stroke="#e08a00" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="755" y="336" font-size="12" fill="#e08a00" text-anchor="middle" font-weight="700">перемычка VBS–IN−</text>
<rect x="1010" y="170" width="200" height="170" rx="10" fill="#f3f3f3" stroke="#333" stroke-width="3"/>
<text x="1110" y="205" font-size="17" fill="#111" text-anchor="middle" font-weight="700">К шине 12 В:</text>
<text x="1110" y="235" font-size="14" fill="#111" text-anchor="middle" font-weight="400">зарядное устройство</text>
<text x="1110" y="257" font-size="14" fill="#111" text-anchor="middle" font-weight="400">RPi · роутер · инвертор</text>
<text x="1110" y="287" font-size="13" fill="#555" text-anchor="middle" font-weight="400">все «+» — сюда,</text>
<text x="1110" y="305" font-size="13" fill="#555" text-anchor="middle" font-weight="400">все «−» — на минус АКБ</text>
<circle cx="1010" cy="250" r="8" fill="#d62828"/>
<path d="M900,250 H1010" fill="none" stroke="#d62828" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="1110" cy="340" r="8" fill="#222"/>
<path d="M125,340 V400 H1110 V340" fill="none" stroke="#222" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="160" y="392" font-size="14" fill="#222" text-anchor="start" font-weight="700">минус АКБ</text>
<rect x="545" y="520" width="220" height="390" rx="14" fill="#6d28a8" stroke="#3b1260" stroke-width="3"/>
<rect x="615" y="510" width="80" height="44" rx="8" fill="#cfd4da" stroke="#555" stroke-width="2"/>
<text x="655" y="536" font-size="13" fill="#333" text-anchor="middle" font-weight="700">USB-C</text>
<rect x="607" y="630" width="96" height="110" rx="6" fill="#0a0a0a" stroke="#888" stroke-width="2"/>
<text x="655" y="688" font-size="14" fill="#9ad" text-anchor="middle" font-weight="400">OLED</text>
<text x="655" y="708" font-size="12" fill="#9ad" text-anchor="middle" font-weight="400">0x3C</text>
<text x="655" y="888" font-size="13" fill="#e9d5ff" text-anchor="middle" font-weight="400">ESP32-C3 · monitor-c3oled</text>
<circle cx="559" cy="590" r="7" fill="#d9c36a"/>
<circle cx="751" cy="590" r="7" fill="#d9c36a"/>
<text x="573" y="595" font-size="14" fill="#fff" text-anchor="start" font-weight="700">5V</text>
<text x="737" y="595" font-size="14" fill="#fff" text-anchor="end" font-weight="700">10</text>
<circle cx="559" cy="626" r="7" fill="#d9c36a"/>
<circle cx="751" cy="626" r="7" fill="#d9c36a"/>
<text x="573" y="631" font-size="14" fill="#fff" text-anchor="start" font-weight="700">GND</text>
<text x="737" y="631" font-size="14" fill="#fff" text-anchor="end" font-weight="700">9</text>
<circle cx="559" cy="662" r="7" fill="#d9c36a"/>
<circle cx="751" cy="662" r="7" fill="#d9c36a"/>
<text x="573" y="667" font-size="14" fill="#fff" text-anchor="start" font-weight="700">3V3</text>
<text x="737" y="667" font-size="14" fill="#fff" text-anchor="end" font-weight="700">8</text>
<circle cx="559" cy="698" r="7" fill="#d9c36a"/>
<circle cx="751" cy="698" r="7" fill="#d9c36a"/>
<text x="573" y="703" font-size="14" fill="#fff" text-anchor="start" font-weight="700">RX</text>
<text x="737" y="703" font-size="14" fill="#fff" text-anchor="end" font-weight="700">7</text>
<circle cx="559" cy="734" r="7" fill="#d9c36a"/>
<circle cx="751" cy="734" r="7" fill="#d9c36a"/>
<text x="573" y="739" font-size="14" fill="#fff" text-anchor="start" font-weight="700">TX</text>
<text x="737" y="739" font-size="14" fill="#fff" text-anchor="end" font-weight="700">6</text>
<circle cx="559" cy="770" r="7" fill="#d9c36a"/>
<circle cx="751" cy="770" r="7" fill="#d9c36a"/>
<text x="573" y="775" font-size="14" fill="#fff" text-anchor="start" font-weight="700">2</text>
<text x="737" y="775" font-size="14" fill="#fff" text-anchor="end" font-weight="700">5</text>
<circle cx="559" cy="806" r="7" fill="#d9c36a"/>
<circle cx="751" cy="806" r="7" fill="#d9c36a"/>
<text x="573" y="811" font-size="14" fill="#fff" text-anchor="start" font-weight="700">1</text>
<text x="737" y="811" font-size="14" fill="#fff" text-anchor="end" font-weight="700">4</text>
<circle cx="559" cy="842" r="7" fill="#d9c36a"/>
<circle cx="751" cy="842" r="7" fill="#d9c36a"/>
<text x="573" y="847" font-size="14" fill="#fff" text-anchor="start" font-weight="700">0</text>
<text x="737" y="847" font-size="14" fill="#fff" text-anchor="end" font-weight="700">3</text>
<path d="M530,290 V626 H559" fill="none" stroke="#222" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="530" cy="400" r="7" fill="#222"/>
<path d="M480,290 V392 a8,8 0 0 1 0,16 V662 H559" fill="none" stroke="#e08a00" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M630,290 V392 a8,8 0 0 1 0,16 V440 H800 V770 H751" fill="none" stroke="#1d6fd6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M580,290 V392 a8,8 0 0 1 0,16 V462 H780 V734 H751" fill="none" stroke="#17a34a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="496" y="654" font-size="13" fill="#e08a00" text-anchor="start" font-weight="700">3,3 В</text>
<text x="496" y="618" font-size="13" fill="#222" text-anchor="start" font-weight="700">GND</text>
<text x="812" y="728" font-size="13" fill="#17a34a" text-anchor="start" font-weight="700">SCL = GPIO6</text>
<text x="812" y="786" font-size="13" fill="#1d6fd6" text-anchor="start" font-weight="700">SDA = GPIO5</text>
<text x="1010" y="470" font-size="17" fill="#111" text-anchor="start" font-weight="700">Важно</text>
<text x="1010" y="496" font-size="15" fill="#111" text-anchor="start" font-weight="400">1. Модуль с R100 как есть НЕ подходит: шунт 0,1 Ом</text>
<text x="1010" y="522" font-size="15" fill="#111" text-anchor="start" font-weight="400">    читает только до ±0,8 А, на 4 А греется (1,6 Вт).</text>
<text x="1010" y="548" font-size="15" fill="#111" text-anchor="start" font-weight="400">    Замените резистор R100 на R010 (2512, 10 мОм).</text>
<text x="1010" y="574" font-size="15" fill="#111" text-anchor="start" font-weight="400">2. Автомат: плюс АКБ → вывод 2 (LINE),</text>
<text x="1010" y="600" font-size="15" fill="#111" text-anchor="start" font-weight="400">    вывод 3 (LOAD) → IN+. Вывод 1 (WS) не нужен.</text>
<text x="1010" y="626" font-size="15" fill="#111" text-anchor="start" font-weight="400">3. Автомат ставьте вплотную к клемме плюса АКБ.</text>
<text x="1010" y="652" font-size="15" fill="#111" text-anchor="start" font-weight="400">4. VBS соедините перемычкой с IN− на разъёме.</text>
<text x="1010" y="678" font-size="15" fill="#111" text-anchor="start" font-weight="400">5. Силовые провода — в большие отверстия,</text>
<text x="1010" y="704" font-size="15" fill="#111" text-anchor="start" font-weight="400">    прозвоните их на пины IN+/IN− разъёма.</text>
<text x="1010" y="730" font-size="15" fill="#111" text-anchor="start" font-weight="400">6. VCC — на 3,3 В, GND — общий с минусом АКБ.</text>
<text x="1010" y="756" font-size="15" fill="#111" text-anchor="start" font-weight="400">7. Знак тока перепутан — ina_invert: true.</text>
</svg>