<text x="40" y="44" font-size="26" fill="#111" text-anchor="start" font-weight="700">Схема 4: отключение нагрузки при глубоком разряде АКБ (реле на ESP32-C3, GPIO10)</text>
<text x="40" y="72" font-size="15" fill="#555" text-anchor="start" font-weight="400">Реле нормально разомкнутое (30–87): без питания нагрузка отключена. Зарядное и монитор подключены к шине ДО реле.</text>
