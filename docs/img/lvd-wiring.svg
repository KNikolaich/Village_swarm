<text x="706" y="870" font-size="12" fill="#fff" text-anchor="end" font-weight="700">GPIO10</text>
<path d="M720,850 H870 a10,10 0 0 1 20,0 H920 V490" fill="none" stroke="#1d6fd6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
