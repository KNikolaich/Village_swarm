<path d="M600,940 V1000" fill="none" stroke="#222" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="612" y="962" font-size="12" fill="#333" text-anchor="start" font-weight="700">GND</text>
<text x="150" y="400" font-size="18" fill="#111" text-anchor="start" font-weight="700">Что важно</text>
<text x="150" y="428" font-size="14" fill="#222" text-anchor="start" font-weight="400">1. Реле берём автомобильное 12 В 30 А</text>
<text x="150" y="452" font-size="14" fill="#222" text-anchor="start" font-weight="400">   (4 контакта: 30, 85, 86, 87).</text>
<text x="150" y="476" font-size="14" fill="#222" text-anchor="start" font-weight="400">2. Включается через NPN: GPIO10 не</text>
<text x="150" y="500" font-size="14" fill="#222" text-anchor="start" font-weight="400">   тянет катушку напрямую.</text>
<text x="150" y="524" font-size="14" fill="#222" text-anchor="start" font-weight="400">3. Диод 1N4007 обязателен (полоска к +12 В,</text>
<text x="150" y="548" font-size="14" fill="#222" text-anchor="start" font-weight="400">   иначе выброс убьёт транзистор).</text>
<text x="150" y="572" font-size="14" fill="#222" text-anchor="start" font-weight="400">4. Контакт 87, а не 87a: нормально</text>
<text x="150" y="596" font-size="14" fill="#222" text-anchor="start" font-weight="400">   разомкнутый: без питания нагр.</text>
<text x="150" y="620" font-size="14" fill="#222" text-anchor="start" font-weight="400">   отключена.</text>
<text x="150" y="644" font-size="14" fill="#222" text-anchor="start" font-weight="400">5. Зарядное и монитор — на шину до</text>
<text x="150" y="668" font-size="14" fill="#222" text-anchor="start" font-weight="400">   реле: после отключения АКБ</text>
<text x="150" y="692" font-size="14" fill="#222" text-anchor="start" font-weight="400">   заряжается, и нагрузка вернётся.</text>
<text x="150" y="716" font-size="14" fill="#222" text-anchor="start" font-weight="400">6. Заряд идёт через шунт в обратную</text>
<text x="150" y="740" font-size="14" fill="#222" text-anchor="start" font-weight="400">   сторону: в Ач он вычитается.</text>
<text x="150" y="764" font-size="14" fill="#222" text-anchor="start" font-weight="400">7. Пороги: failsafe.lvd в конфиге.</text>
</svg>